site_name: "FRed Lobster 100 Rulebook"
site_description: "Official Competition Rules and Technical Regulations"
repo_url: https://github.com/ruddyrid/race-rulebook

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    # Light Mode (matches your site branding)
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    # Dark Mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  font:
    text: Hanken Grotesk
    code: Spline Sans Mono

nav:
  - Home: index.md
  - Quick Reference: quick-reference.md
  - Rules:
      - Overview: rules/index.md
      - Safety: rules/safety.md
      - Vehicle Classes: rules/classes.md
      - Technical Specifications: rules/technical.md
      - Race Procedures: rules/procedures.md
      - Penalties & Protests: rules/penalties.md
  - Appendices:
      - Diagrams & Forms: appendices/index.md
      - Glossary: appendices/glossary.md
  - Changelog: changelog.md

plugins:
  - search
  - print-site:
      add_to_navigation: true
      print_page_title: "Printable Rulebook"
      add_table_of_contents: true
      toc_title: "Table of Contents"
      
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list

extra_css:
  - css/custom.css